name: 🧠 KKA-Zero TITAN-12B Cloud Trainer & LLM Distiller

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'IA.cpp'
      - 'repositorios.txt'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

# SEMAFORO ANTI-CHOQUES: Si hay 2 entrenamientos a la vez, hace fila sin dar error!
concurrency:
  group: kka-titan-training-queue
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  titan-cloud-train:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 1. Descargar tu Repositorio IACoder
        uses: actions/checkout@v4

      - name: ⚙️ 2. Compilar IA.cpp (TITAN-12B) en Linux
        run: g++ -O3 IA.cpp -o kka_trainer

      - name: 🎓 3. Destilar Conocimiento del Profesor LLM Gigante (OSDev / C++ Ring-0)
        run: |
          cat << 'EOF' > distill_llm.cpp
          #define main main_ignore
          #include "IA.cpp"
          #undef main
          int main() {
              g_ia_titan.inicializar(&g_master_v22, g_lobulos_v22, MAX_LOBULOS_RAM,
                                     g_vault_v24, MAX_VAULT_FUNCTIONS,
                                     g_klein_v24, MAX_EXPERT_BLOCKS_RAM);
              cargar_cerebro_completo("cerebro_omega.kkaf");
              char out[4096];
              g_ia_titan.responder_con_inteligencia_maxima("Implementar Page Fault Handler ISR 14 en C++ freestanding x86_64", true, out, sizeof(out));
              g_ia_titan.responder_con_inteligencia_maxima("Implementar AHCI SATA y NVMe PCIe BAR0 scan en C++ Ring-0", true, out, sizeof(out));
              g_ia_titan.responder_con_inteligencia_maxima("Implementar Allocator Slab/Buddy en C++ sin malloc para Kernel", true, out, sizeof(out));
              guardar_cerebro_completo("cerebro_omega.kkaf");
              return 0;
          }
          EOF
          g++ -O3 distill_llm.cpp -o kka_distill || true
          ./kka_distill || true
          rm -f distill_llm.cpp kka_distill

      - name: 📚 4. Leer siguientes 3 repositorios de 'repositorios.txt' y Entrenar
        run: |
          if [ ! -f repositorios.txt ]; then
            echo "limine-bootloader/limine" > repositorios.txt
          fi

          grep -v '^[[:space:]]*#' repositorios.txt | grep -v '^[[:space:]]*$' | tr -d '\r' > /tmp/clean_repos.txt || true
          TOTAL_REPOS=$(wc -l < /tmp/clean_repos.txt)

          CURSOR=1
          if [ -f progreso_repos.txt ]; then
            CURSOR=$(cat progreso_repos.txt | tr -d '[:space:]')
          fi

          if [ -z "$CURSOR" ] || [ "$CURSOR" -gt "$TOTAL_REPOS" ]; then
            CURSOR=1
          fi

          BATCH_SIZE=3
          END_LINE=$((CURSOR + BATCH_SIZE - 1))
          mkdir -p /tmp/harvest
          REPOS_APRENDIDOS=""

          for R in $(sed -n "${CURSOR},${END_LINE}p" /tmp/clean_repos.txt); do
            if echo "$R" | grep -q "^http"; then
              URL="$R"
              SLUG=$(echo "$R" | sed 's|https://github.com/||')
            else
              URL="https://github.com/$R.git"
              SLUG="$R"
            fi
            SAFE_DIR=$(echo "$SLUG" | tr '/' '_')
            echo "⬇️ Clonando $SLUG ..."
            git clone --depth 1 --quiet "$URL" "/tmp/harvest/$SAFE_DIR" || true
            REPOS_APRENDIDOS="$REPOS_APRENDIDOS $SLUG"
          done

          FILES=$(find /tmp/harvest -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) | head -n 300)
          if [ -n "$FILES" ]; then
            ./kka_trainer $FILES || true
          fi

          NEXT_CURSOR=$((END_LINE + 1))
          echo "$NEXT_CURSOR" > progreso_repos.txt
          echo "$REPOS_APRENDIDOS" > /tmp/trained_names.txt
          rm -f kka_trainer

      - name: 💾 5. Guardar 'cerebro_omega.kkaf' (Con Anti-Colision Git)
        run: |
          APRENDIDOS=$(cat /tmp/trained_names.txt || echo "lote")
          git config user.name "KKA-Zero TITAN Bot"
          git config user.email "kka-bot@users.noreply.github.com"
          git add cerebro_omega.kkaf progreso_repos.txt repositorios.txt
          git diff --staged --quiet || git commit -m "🧠 TITAN-12B [$APRENDIDOS] -> Cursor $(cat progreso_repos.txt)"
          git pull --rebase -X ours origin main || true
          git push origin main
          
