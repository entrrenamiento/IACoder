name: 🧠 KKA-Zero Multi-Shard Infinite Cloud Trainer

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'IA.cpp'
      - 'repositorios.txt'
  schedule:
    - cron: '0 */4 * * *' # Avanza 3 repositorios y guarda un nuevo Shard en /shards cada 4 horas!
  workflow_dispatch:      # Boton manual para correrlo cuando quieras

# SEMAFORO ANTI-CHOQUES: Evita que dos entrenamientos choquen al hacer git push
concurrency:
  group: kka-multishard-training-queue
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  multishard-cloud-train:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 1. Descargar tu Repositorio IACoder
        uses: actions/checkout@v4

      - name: ⚙️ 2. Preparar carpeta 'shards/' y Compilar IA.cpp en Linux
        run: |
          mkdir -p shards
          # Copiar temporalmente los shards previos para que IA.cpp conozca la numeracion actual
          cp -n shards/cerebro_shard_*.kkaf . 2>/dev/null || true
          g++ -O3 IA.cpp -o kka_trainer

      - name: 🎓 3. Destilar Nuevas Arquitecturas del Profesor LLM Gigante
        run: |
          CURSOR_ACTUAL=1
          if [ -f progreso_repos.txt ]; then
            CURSOR_ACTUAL=$(cat progreso_repos.txt | tr -d '[:space:]')
          fi

          cat << EOF > distill_llm.cpp
          #define main main_ignore
          #include "IA.cpp"
          #undef main
          int main() {
              g_ia_titan.inicializar(&g_master_v22, g_lobulos_v22, MAX_LOBULOS_RAM,
                                     g_vault_v24, MAX_VAULT_FUNCTIONS,
                                     g_klein_v24, MAX_EXPERT_BLOCKS_RAM);
              cargar_cerebro_completo("cerebro_omega.kkaf");
              char out[4096];
              const char* temas_osdev[] = {
                  "Implementar Page Fault Handler ISR 14 en C++ freestanding x86_64",
                  "Implementar Driver NVMe M.2 colas Admin e I/O por DMA en C++ Ring-0",
                  "Implementar Allocator Slab y Buddy System en C++ sin malloc para Kernel",
                  "Implementar Scheduler Multitarea Preemptivo SMP APIC Timer en C++ Ring-0",
                  "Implementar Compositor GUI VESA Framebuffer con Doble Buffer y Mouse PS/2",
                  "Implementar Sistema de Archivos FAT32 y Ext2 en C++ freestanding",
                  "Implementar Pila de Red TCP/IP y Driver Ethernet RTL8139/E1000 en C++",
                  "Implementar Cargador de Ejecutables ELF64 y Syscalls Ring-3 en C++"
              };
              int idx1 = ($CURSOR_ACTUAL) % 8;
              int idx2 = ($CURSOR_ACTUAL + 1) % 8;
              g_ia_titan.responder_con_inteligencia_maxima(temas_osdev[idx1], true, out, sizeof(out));
              g_ia_titan.responder_con_inteligencia_maxima(temas_osdev[idx2], true, out, sizeof(out));
              guardar_cerebro_completo("cerebro_omega.kkaf");
              return 0;
          }
          EOF
          g++ -O3 distill_llm.cpp -o kka_distill || true
          ./kka_distill || true
          rm -f distill_llm.cpp kka_distill

      - name: 📚 4. Leer siguientes 3 repositorios de 'repositorios.txt' y Generar Shards
        run: |
          if [ ! -f repositorios.txt ]; then
            echo "limine-bootloader/limine" > repositorios.txt
          fi

          grep -v '^[[:space:]]*#' repositorios.txt | grep -v '^[[:space:]]*$' | tr -d '\r' > /tmp/clean_repos.txt || true
          TOTAL_REPOS=$(wc -l < /tmp/clean_repos.txt)

          CURSOR=1
          if [ -f progreso_repos.txt ]; then
            CURSOR=$(cat progreso_repos.txt | tr -d '[:space:]')
          fi

          if [ -z "$CURSOR" ] || [ "$CURSOR" -gt "$TOTAL_REPOS" ]; then
            echo "🌐 Fin de la lista alcanzado. Descubriendo nuevos repositorios en GitHub API..."
            curl -s "https://api.github.com/search/repositories?q=language:cpp+topic:osdev&sort=stars&per_page=15" \
              | grep -o '"full_name": *"[^"]*"' | cut -d'"' -f4 >> repositorios.txt || true
            CURSOR=1
          fi

          BATCH_SIZE=3
          END_LINE=$((CURSOR + BATCH_SIZE - 1))
          mkdir -p /tmp/harvest
          REPOS_APRENDIDOS=""

          for R in $(sed -n "${CURSOR},${END_LINE}p" /tmp/clean_repos.txt); do
            if echo "$R" | grep -q "^http"; then
              URL="$R"
              SLUG=$(echo "$R" | sed 's|https://github.com/||')
            else
              URL="https://github.com/$R.git"
              SLUG="$R"
            fi
            SAFE_DIR=$(echo "$SLUG" | tr '/' '_')
            echo "⬇️ Clonando $SLUG ..."
            git clone --depth 1 --quiet "$URL" "/tmp/harvest/$SAFE_DIR" || true
            REPOS_APRENDIDOS="$REPOS_APRENDIDOS $SLUG"
          done

          find /tmp/harvest -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.h" -o -name "*.hpp" -o -name "*.rs" -o -name "*.zig" -o -name "*.asm" \) | head -n 450 > /tmp/file_list.txt

          if [ -s /tmp/file_list.txt ]; then
            xargs -n 50 ./kka_trainer < /tmp/file_list.txt || true
          fi

          # Mover cualquier shard generado a la carpeta 'shards/' y guardar el tomo de este lote!
          mv -f cerebro_shard_*.kkaf shards/ 2>/dev/null || true
          EXISTENTES=$(ls -1 shards/cerebro_shard_*.kkaf 2>/dev/null | wc -l || echo "0")
          NEXT_SHARD_NUM=$((EXISTENTES + 1))
          SHARD_NAME=$(printf "shards/cerebro_shard_%03d.kkaf" "$NEXT_SHARD_NUM")
          cp -f cerebro_omega.kkaf "$SHARD_NAME"
          echo "📦 Guardado nuevo Tomo en carpeta: $SHARD_NAME"

          NEXT_CURSOR=$((END_LINE + 1))
          echo "$NEXT_CURSOR" > progreso_repos.txt
          echo "$REPOS_APRENDIDOS" > /tmp/trained_names.txt
          rm -f kka_trainer /tmp/file_list.txt

      - name: 💾 5. Subir carpeta 'shards/' + 'cerebro_omega.kkaf' a GitHub
        run: |
          APRENDIDOS=$(cat /tmp/trained_names.txt || echo "lote")
          git config user.name "KKA-Zero Multi-Shard Bot"
          git config user.email "kka-bot@users.noreply.github.com"

          git add -f cerebro_omega.kkaf shards/*.kkaf progreso_repos.txt repositorios.txt
          NUM_SHARDS=$(ls -1 shards/cerebro_shard_*.kkaf 2>/dev/null | wc -l || echo "1")
          git diff --staged --quiet || git commit -m "🧠 Carpeta shards/ ($NUM_SHARDS Tomos) [$APRENDIDOS] -> Cursor $(cat progreso_repos.txt)"
          git pull --rebase -X ours origin main || true
          git push origin main
          
